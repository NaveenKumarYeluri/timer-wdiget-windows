name: build

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/AuraTimer/AuraTimer.csproj

      - name: Publish (framework-dependent)
        run: dotnet publish src/AuraTimer/AuraTimer.csproj -c Release -r win-x64 --self-contained false -o artifacts/AuraTimer-win-x64-framework-dependent

      - name: Publish (self-contained)
        run: dotnet publish src/AuraTimer/AuraTimer.csproj -c Release -r win-x64 --self-contained true -o artifacts/AuraTimer-win-x64-self-contained

      - name: Upload artifact (framework-dependent)
        uses: actions/upload-artifact@v7
        with:
          name: AuraTimer-win-x64-framework-dependent
          path: artifacts/AuraTimer-win-x64-framework-dependent

      - name: Upload artifact (self-contained)
        uses: actions/upload-artifact@v7
        with:
          name: AuraTimer-win-x64-self-contained
          path: artifacts/AuraTimer-win-x64-self-contained

      - name: Package release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/AuraTimer-win-x64-framework-dependent/* -DestinationPath artifacts/AuraTimer-win-x64-framework-dependent.zip -Force
          Compress-Archive -Path artifacts/AuraTimer-win-x64-self-contained/* -DestinationPath artifacts/AuraTimer-win-x64-self-contained.zip -Force

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/AuraTimer-win-x64-framework-dependent.zip
            artifacts/AuraTimer-win-x64-self-contained.zip
